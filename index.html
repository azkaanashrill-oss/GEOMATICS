<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOMATICS v1.0</title>
    <style>
        /* Gaya & Tema Pemetaan (Earth & Surveying Theme) */
        :root {
            --primary-color: #2e7d32; /* Hijau Hutan/Peta */
            --secondary-color: #f57c00; /* Oranye Kompas */
            --bg-dark: #1b2a1c; /* Gelap Bertema */
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background bertema kontur/pemetaan abstrak menggunakan CSS gradasi */
            background: radial-gradient(circle at 20% 30%, #2e4f32 0%, #121f14 100%);
            background-attachment: fixed;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--primary-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .menu-section {
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 8px rgba(46, 125, 50, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        /* Tampilan Hasil Perhitungan Beruntun */
        .result-box {
            margin-top: 25px;
            background: #f1f8e9;
            border-left: 5px solid var(--secondary-color);
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result-box h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }

        .step-calculation {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #222;
        }

        .step-line {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .highlight-res {
            font-weight: bold;
            color: var(--secondary-color);
        }

        /* Coming Soon Section */
        .coming-soon-card {
            margin-top: 30px;
            background: #eceff1;
            border: 1px dashed #78909c;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .coming-soon-card h4 {
            color: #37474f;
            margin-bottom: 5px;
        }

        .coming-soon-card p {
            font-size: 13px;
            color: #78909c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GEOMATICS v1.0</h1>
        <p>Aplikasi Perhitungan Bacaan Benang & Jarak</p>
    </header>

    <div class="menu-section">
        <div class="input-group">
            <label for="input_ba">Benang Atas (BA) - <small>Kosongkan jika ingin dicari</small></label>
            <input type="number" id="input_ba" placeholder="Masukkan angka BA (mm)...">
        </div>

        <div class="input-group">
            <label for="input_bt">Benang Tengah (BT) - <small>Kosongkan jika ingin dicari</small></label>
            <input type="number" id="input_bt" placeholder="Masukkan angka BT (mm)...">
        </div>

        <div class="input-group">
            <label for="input_bb">Benang Bawah (BB) - <small>Kosongkan jika ingin dicari</small></label>
            <input type="number" id="input_bb" placeholder="Masukkan angka BB (mm)...">
        </div>

        <button onclick="hitungPemetaan()">HITUNG SEKARANG</button>
    </div>

    <div class="result-box" id="resultBox">
        <h3>Hasil Perhitungan Bertahap:</h3>
        <div class="step-calculation" id="calcDetails">
            </div>
    </div>

    <div class="coming-soon-card">
        <h4>🚧 Fitur Selanjutnya</h4>
        <p>Tunggu Update Selanjutnya (Menunggu Perintah)</p>
    </div>
</div>

<script>
    function hitungPemetaan() {
        // Mengambil input dan mengubah ke Integer (Tanpa Desimal)
        let ba_val = document.getElementById('input_ba').value;
        let bt_val = document.getElementById('input_bt').value;
        let bb_val = document.getElementById('input_bb').value;

        let BA = ba_val !== "" ? parseInt(ba_val) : null;
        let BT = bt_val !== "" ? parseInt(bt_val) : null;
        let BB = bb_val !== "" ? parseInt(bb_val) : null;

        let stepText = "";

        // Validasi: Minimal 2 input harus diisi agar rumus bisa bekerja
        let inputCount = [BA, BT, BB].filter(v => v !== null).length;
        if (inputCount < 2) {
            alert("Harap masukkan minimal 2 nilai benang untuk menghitung!");
            return;
        }

        // --- PERHITUNGAN BERTAHAP & BERUNTUN ---

        // Kasus 1: Mencari BA jika BT dan BB diketahui
        if (BA === null && BT !== null && BB !== null) {
            BA = (2 * BT) - BB;
            stepText += `<div class="step-line">
                <strong>1. Langkah Mencari Benang Atas (BA):</strong><br>
                Rumus: BA = (2 × BT) - BB<br>
                Proses: (2 × ${BT}) - ${BB}<br>
                Proses: ${2 * BT} - ${BB}<br>
                Hasil BA = <span class="highlight-res">${BA} mm</span>
            </div>`;
        } 
        // Kasus 2: Mencari BT jika BA dan BB diketahui
        else if (BT === null && BA !== null && BB !== null) {
            BT = Math.round((BA + BB) / 2); // murni integer dibulatkan terdekat jika ada ganjil
            stepText += `<div class="step-line">
                <strong>1. Langkah Mencari Benang Tengah (BT):</strong><br>
                Rumus: BT = (BA + BB) : 2<br>
                Proses: (${BA} + ${BB}) : 2<br>
                Proses: ${BA + BB} : 2<br>
                Hasil BT = <span class="highlight-res">${BT} mm</span>
            </div>`;
        } 
        // Kasus 3: Mencari BB jika BT dan BA diketahui
        else if (BB === null && BT !== null && BA !== null) {
            BB = (2 * BT) - BA;
            stepText += `<div class="step-line">
                <strong>1. Langkah Mencari Benang Bawah (BB):</strong><br>
                Rumus: BB = (2 × BT) - BA<br>
                Proses: (2 × ${BT}) - ${BA}<br>
                Proses: ${2 * BT} - ${BA}<br>
                Hasil BB = <span class="highlight-res">${BB} mm</span>
            </div>`;
        } else {
            // Jika ketiga input sudah diisi, kita langsung tampilkan nilainya saja sebagai dasar
            stepText += `<div class="step-line">
                <strong>Informasi Input Benang:</strong><br>
                BA = ${BA} mm<br>
                BT = ${BT} mm<br>
                BB = ${BB} mm
            </div>`;
        }

        // --- MENGHITUNG JARAK D ---
        // Rumus: D = (BA - BB) * 100
        let selisih = BA - BB;
        let D_mm = selisih * 100;
        let D_m = D_mm / 1000; // konversi ke meter

        stepText += `<div class="step-line">
            <strong>2. Langkah Mencari Jarak (D):</strong><br>
            Rumus: D = (BA - BB) × 100<br>
            Proses: (${BA} - ${BB}) × 100<br>
            Proses: ${selisih} × 100<br>
            Hasil Jarak D = <span class="highlight-res">${D_mm} mm / ${D_m} M</span>
        </div>`;

        // Menampilkan output ke layar
        document.getElementById('calcDetails').innerHTML = stepText;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
